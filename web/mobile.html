<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123643">
<title>练字帖 · 手机预览</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 35%,#f6fbfa,#cbdfe0 78%);color:#4e6570;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;gap:16px}
  .shell-label{font-size:11px;letter-spacing:3px;display:flex;gap:26px;align-items:center;font-weight:600}
  .shell-label a{color:#52757b;text-decoration:none;letter-spacing:1px;font-weight:600;transition:color .15s}
  .shell-label a:hover{color:#147f83}
  .device-space{position:relative;flex:none}
  /* iPhone 金属外壳 */
  .device{width:414px;height:868px;padding:12px;background:linear-gradient(115deg,#648f94,#163d48 15%,#2c6970 48%,#102e39 80%,#7ca7a7);
    border-radius:61px;position:absolute;top:0;left:0;transform-origin:top left;
    box-shadow:0 38px 76px #12364340,inset 0 0 0 2px #a6cbca,inset 0 0 0 5px #102e39}
  .device:before{content:'';position:absolute;left:-3px;top:172px;height:78px;width:4px;border-radius:3px;background:#24505b;box-shadow:0 96px #24505b}
  .device:after{content:'';position:absolute;right:-3px;top:236px;height:104px;width:4px;border-radius:3px;background:#24505b}
  iframe{display:block;width:390px;height:844px;border:0;border-radius:49px;background:#eff4f5}
  .shell-note{margin:0;font-size:11px;color:#6f8a91;letter-spacing:1px;text-align:center;max-width:380px}
  @media(max-width:450px){body{padding:8px;gap:8px}.shell-label{font-size:9px}.shell-note{display:none}}
</style>
</head>
<body>
  <div class="shell-label">
    <span>练字帖 / 手机版</span>
    <a href="studio.html" target="_blank" rel="noopener">桌面版 ↗</a>
  </div>
  <div class="device-space">
    <div class="device">
      <iframe src="studio.html?phone=1" title="练字帖手机预览"></iframe>
    </div>
  </div>
  <p class="shell-note">在手机内输入文字、切换模板、校对拼音、调节字格与配色 · 底部工具栏即开即用</p>
  <script>
    function fitDevice(){
      var scale = Math.min(1, (innerWidth-26)/414, (innerHeight-96)/868);
      var d = document.querySelector('.device');
      d.style.transform = 'scale(' + scale + ')';
      var sp = document.querySelector('.device-space');
      sp.style.width = (414*scale) + 'px';
      sp.style.height = (868*scale) + 'px';
    }
    addEventListener('resize', fitDevice);
    fitDevice();
  </script>
</body>
</html>
